<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Inter:wght@300;400&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a2e"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Logo mark (original navbar icon scaled to 200px, centred at x=200 y=200) -->
  <!-- original viewBox 0 0 40 40 → scale(5) translate so centre lands at 200,200 -->
  <g transform="translate(100, 100) scale(5)">
    <!-- Outer dashed ring -->
    <circle cx="20" cy="20" r="18"
            stroke="#c83c5a" stroke-width="2.5"
            stroke-dasharray="56 14" stroke-linecap="round"
            fill="none"/>
    <!-- A shape -->
    <path d="M13 28 L20 10 L27 28"
          stroke="#faf8f5" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>
    <!-- A crossbar -->
    <path d="M15.5 22.5 H24.5"
          stroke="#c83c5a" stroke-width="2.5"
          stroke-linecap="round"/>
    <!-- Link dot -->
    <circle cx="29" cy="28" r="2.5" fill="#c83c5a"/>
  </g>

  <!-- Vertical divider -->
  <line x1="340" y1="120" x2="340" y2="280"
        stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Wordmark -->
  <text x="378" y="225"
        font-family="'Playfair Display', 'Times New Roman', Georgia, serif"
        font-size="88"
        font-weight="400"
        fill="#faf8f5"
        dominant-baseline="middle"
        letter-spacing="-1">Athletic<tspan font-weight="700" fill="#c83c5a">Linq</tspan></text>

  <!-- Tagline -->
  <text x="381" y="296"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="17"
        font-weight="300"
        fill="#faf8f5"
        fill-opacity="0.4"
        letter-spacing="5">CONNECT · PERFORM · EXCEL</text>
</svg>
