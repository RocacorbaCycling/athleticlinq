<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Inter:wght@300;400&amp;display=swap');
    </style>
    <linearGradient id="banBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a2e"/>
      <stop offset="60%" style="stop-color:#1a2744"/>
      <stop offset="100%" style="stop-color:#0f1a2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#banBg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="1" x2="1500" y2="1" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
  <line x1="0" y1="499" x2="1500" y2="499" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>

  <!-- Logo mark centred at 540,250, scale=8 → translate(540-20*8, 250-20*8) = (380, 90) -->
  <g transform="translate(380, 90) scale(8)">
    <circle cx="20" cy="20" r="18"
            stroke="#c83c5a" stroke-width="2.5"
            stroke-dasharray="56 14" stroke-linecap="round"
            fill="none"/>
    <path d="M13 28 L20 10 L27 28"
          stroke="#faf8f5" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>
    <path d="M15.5 22.5 H24.5"
          stroke="#c83c5a" stroke-width="2.5"
          stroke-linecap="round"/>
    <circle cx="29" cy="28" r="2.5" fill="#c83c5a"/>
  </g>

  <!-- Vertical divider -->
  <line x1="710" y1="155" x2="710" y2="345"
        stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Wordmark -->
  <text x="748" y="255"
        font-family="'Playfair Display', 'Times New Roman', Georgia, serif"
        font-size="96"
        font-weight="400"
        fill="#faf8f5"
        dominant-baseline="middle"
        letter-spacing="-1">Athletic<tspan font-weight="700" fill="#c83c5a">Linq</tspan></text>

  <!-- Tagline -->
  <text x="751" y="320"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="20"
        font-weight="300"
        fill="#faf8f5"
        fill-opacity="0.4"
        letter-spacing="6">CONNECT · PERFORM · EXCEL</text>

  <!-- Sub-descriptor -->
  <text x="751" y="358"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="16"
        font-weight="400"
        fill="#c83c5a"
        fill-opacity="0.65"
        letter-spacing="2">The Global Cycling Talent Platform</text>

  <!-- Bottom-left website -->
  <text x="48" y="472"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="14"
        font-weight="300"
        fill="#faf8f5"
        fill-opacity="0.22"
        letter-spacing="2">athleticlinq.com</text>

  <!-- Coral accent line bottom right -->
  <line x1="1340" y1="462" x2="1460" y2="462"
        stroke="#c83c5a" stroke-width="2" stroke-opacity="0.4"/>
</svg>
