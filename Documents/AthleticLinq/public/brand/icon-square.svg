<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgSq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a2e"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square (app icon) -->
  <rect width="800" height="800" rx="160" fill="url(#bgSq)"/>

  <!-- Logo mark centred at 400,380, scaled to 440px (scale=11, so translate = 400-20*11, 380-20*11) -->
  <g transform="translate(180, 160) scale(11)">
    <circle cx="20" cy="20" r="18"
            stroke="#c83c5a" stroke-width="2.5"
            stroke-dasharray="56 14" stroke-linecap="round"
            fill="none"/>
    <path d="M13 28 L20 10 L27 28"
          stroke="#faf8f5" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>
    <path d="M15.5 22.5 H24.5"
          stroke="#c83c5a" stroke-width="2.5"
          stroke-linecap="round"/>
    <circle cx="29" cy="28" r="2.5" fill="#c83c5a"/>
  </g>

  <!-- Wordmark below the icon -->
  <text x="400" y="680"
        font-family="'Playfair Display', 'Times New Roman', Georgia, serif"
        font-size="60"
        font-weight="400"
        fill="#faf8f5"
        text-anchor="middle"
        letter-spacing="-0.5">Athletic<tspan font-weight="700" fill="#c83c5a">Linq</tspan></text>
</svg>
