<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Inter:wght@300;400&amp;display=swap');
    </style>
  </defs>

  <!-- Transparent background — place on any dark surface -->

  <!-- Logo mark — all white with coral accents intact -->
  <g transform="translate(100, 100) scale(5)">
    <circle cx="20" cy="20" r="18"
            stroke="#ffffff" stroke-width="2.5"
            stroke-dasharray="56 14" stroke-linecap="round"
            fill="none" fill-opacity="0"/>
    <path d="M13 28 L20 10 L27 28"
          stroke="#ffffff" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>
    <path d="M15.5 22.5 H24.5"
          stroke="#ffffff" stroke-width="2.5"
          stroke-linecap="round" stroke-opacity="0.7"/>
    <circle cx="29" cy="28" r="2.5" fill="#ffffff" fill-opacity="0.7"/>
  </g>

  <!-- Divider -->
  <line x1="340" y1="120" x2="340" y2="280"
        stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Wordmark — all white -->
  <text x="378" y="225"
        font-family="'Playfair Display', 'Times New Roman', Georgia, serif"
        font-size="88"
        font-weight="400"
        fill="#ffffff"
        dominant-baseline="middle"
        letter-spacing="-1">Athletic<tspan font-weight="700" fill-opacity="0.75">Linq</tspan></text>

  <!-- Tagline -->
  <text x="381" y="296"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="17"
        font-weight="300"
        fill="#ffffff"
        fill-opacity="0.4"
        letter-spacing="5">CONNECT · PERFORM · EXCEL</text>
</svg>
