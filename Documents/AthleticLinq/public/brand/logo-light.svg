<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Inter:wght@300;400&amp;display=swap');
    </style>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f5"/>
      <stop offset="100%" style="stop-color:#f0ebe3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgLight)"/>
  <rect x="20" y="20" width="1160" height="360" rx="8"
        fill="none" stroke="#1a2744" stroke-width="1" stroke-opacity="0.07"/>

  <!-- Logo mark — same icon, A stroke becomes navy on light bg -->
  <g transform="translate(100, 100) scale(5)">
    <circle cx="20" cy="20" r="18"
            stroke="#c83c5a" stroke-width="2.5"
            stroke-dasharray="56 14" stroke-linecap="round"
            fill="none"/>
    <path d="M13 28 L20 10 L27 28"
          stroke="#1a2744" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>
    <path d="M15.5 22.5 H24.5"
          stroke="#c83c5a" stroke-width="2.5"
          stroke-linecap="round"/>
    <circle cx="29" cy="28" r="2.5" fill="#c83c5a"/>
  </g>

  <!-- Divider -->
  <line x1="340" y1="120" x2="340" y2="280"
        stroke="#1a2744" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Wordmark -->
  <text x="378" y="225"
        font-family="'Playfair Display', 'Times New Roman', Georgia, serif"
        font-size="88"
        font-weight="400"
        fill="#1a2744"
        dominant-baseline="middle"
        letter-spacing="-1">Athletic<tspan font-weight="700" fill="#c83c5a">Linq</tspan></text>

  <!-- Tagline -->
  <text x="381" y="296"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="17"
        font-weight="300"
        fill="#1a2744"
        fill-opacity="0.38"
        letter-spacing="5">CONNECT · PERFORM · EXCEL</text>
</svg>
