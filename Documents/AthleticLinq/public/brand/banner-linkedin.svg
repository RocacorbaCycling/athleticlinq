<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Inter:wght@300;400&amp;display=swap');
    </style>
    <linearGradient id="liBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f1a2e"/>
      <stop offset="50%" style="stop-color:#1a2744"/>
      <stop offset="100%" style="stop-color:#0f1a2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1128" height="191" fill="url(#liBg)"/>

  <!-- Logo mark at x=95, y=95 centre, scale=3.5 → translate(95-70, 95-70) = (25, 25) -->
  <g transform="translate(25, 25) scale(3.5)">
    <circle cx="20" cy="20" r="18"
            stroke="#c83c5a" stroke-width="2.5"
            stroke-dasharray="56 14" stroke-linecap="round"
            fill="none"/>
    <path d="M13 28 L20 10 L27 28"
          stroke="#faf8f5" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>
    <path d="M15.5 22.5 H24.5"
          stroke="#c83c5a" stroke-width="2.5"
          stroke-linecap="round"/>
    <circle cx="29" cy="28" r="2.5" fill="#c83c5a"/>
  </g>

  <!-- Divider -->
  <line x1="173" y1="46" x2="173" y2="145"
        stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Wordmark -->
  <text x="196" y="95"
        font-family="'Playfair Display', 'Times New Roman', Georgia, serif"
        font-size="55"
        font-weight="400"
        fill="#faf8f5"
        dominant-baseline="middle"
        letter-spacing="-0.5">Athletic<tspan font-weight="700" fill="#c83c5a">Linq</tspan></text>

  <!-- Tagline -->
  <text x="198" y="148"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="13"
        font-weight="300"
        fill="#faf8f5"
        fill-opacity="0.38"
        letter-spacing="4">CONNECT · PERFORM · EXCEL</text>

  <!-- Right side descriptor -->
  <text x="830" y="88"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="14"
        font-weight="300"
        fill="#c83c5a"
        fill-opacity="0.65"
        letter-spacing="1.5">The Global Cycling Talent Platform</text>

  <text x="830" y="113"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="12"
        font-weight="300"
        fill="#faf8f5"
        fill-opacity="0.22"
        letter-spacing="1">athleticlinq.com</text>
</svg>
